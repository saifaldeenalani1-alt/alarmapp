name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show ANDROID_HOME
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk"
          echo "---sdk contents---"
          ls -la /usr/local/lib/android/sdk/
          echo "---platforms---"
          ls -la /usr/local/lib/android/sdk/platforms/
          echo "---build-tools---"
          ls -la /usr/local/lib/android/sdk/build-tools/
          echo "---gradle version---"
          gradle --version

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Locate APK
        if: always()
        run: find / -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlarmApp-Debug
          path: "**/outputs/apk/debug/*.apk"
