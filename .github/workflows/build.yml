name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Debug SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/ || echo "No ANDROID_HOME"
          echo "SDK_ROOT=$SDK_ROOT"
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "No default SDK path"

      - name: Accept licenses
        run: |
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_PATH --licenses 2>/dev/null || true
          yes | $SDK_PATH/tools/bin/sdkmanager --sdk_root=$SDK_PATH --licenses 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -200

      - name: Find APK
        if: always()
        run: |
          echo "=== Full build tree ==="
          find app/build -type d -maxdepth 5 2>/dev/null
          echo "=== APK files ==="
          find app/build -name "*.apk" -type f 2>/dev/null || echo "NO APK FOUND"
          echo "=== AAB files ==="
          find app/build -name "*.aab" -type f 2>/dev/null || echo "NO AAB FOUND"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlarmApp-Debug
          path: app/build/**/*.apk
