name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fsSL "$SDK_URL" -o /tmp/cmdline-tools.zip
          mkdir -p $HOME/android/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android/cmdline-tools/
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          yes | $HOME/android/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android "platforms;android-35" "build-tools;35.0.1" > /dev/null 2>&1 || true
          echo "ANDROID_SDK_ROOT=$HOME/android" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "sdk.dir=$HOME/android" > local.properties

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version=8.11.1 2>/dev/null || true
          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Show results
        if: always()
        run: |
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log
          echo "=== APK search ==="
          find $HOME/android -name "*.apk" 2>/dev/null
          find app/build -name "*.apk" 2>/dev/null
          find app/build -type f 2>/dev/null | head -30

      - name: Upload APK
        if: env.EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: AlarmApp-Debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/**/*.apk
          if-no-files-found: ignore
