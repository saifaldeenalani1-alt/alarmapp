name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Debug SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/ || echo "No ANDROID_HOME"
          echo "SDK_ROOT=$SDK_ROOT"
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "No default SDK path"

      - name: Accept licenses
        run: |
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_PATH --licenses 2>/dev/null || true
          yes | $SDK_PATH/tools/bin/sdkmanager --sdk_root=$SDK_PATH --licenses 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -200
          echo "=== Exit code: $? ==="

      - name: Find and copy APK
        if: always()
        run: |
          find / -name "*.apk" -type f 2>/dev/null | head -20
          find /home -name "*.apk" -type f 2>/dev/null | head -20
          echo "--- Project tree ---"
          find . -type f -name "*.apk" 2>/dev/null
          find . -type f -name "*.aab" 2>/dev/null
          echo "--- build dirs ---"
          find . -type d -name "outputs" 2>/dev/null
          echo "--- app/build contents ---"
          find app/build -type f 2>/dev/null | head -30
          echo "--- checking variant ---"
          find app/build -type d -name "variant*" 2>/dev/null
          ./gradlew --no-daemon :app:printVariants 2>/dev/null || true
