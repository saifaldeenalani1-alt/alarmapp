name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          sudo unzip -q gradle-8.11.1-bin.zip -d /opt
          sudo ln -sf /opt/gradle-8.11.1/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List APKs
        run: find app/build -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK found"

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlarmApp-Debug
          path: app/build/outputs/apk/debug/*.apk
