name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper (8.11.1)
        run: gradle wrapper --gradle-version=8.11.1

      - name: Build
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/build.log
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Show error in summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Build Error Log'
            echo '```'
            tail -200 /tmp/build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlarmApp-Debug
          path: "**/outputs/apk/debug/*.apk"
